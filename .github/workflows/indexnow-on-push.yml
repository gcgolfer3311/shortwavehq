name: IndexNow on push

# The nightly job only submits pages it rebuilt itself. This sends pages that
# arrive through a manual push (new sections, fixes) to Bing/Yandex via IndexNow.
# Pushes made by the nightly bot use GITHUB_TOKEN and do not trigger this.
on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:
    inputs:
      base:
        description: 'Git ref of the previous build to compare against'
        required: true
        default: 'HEAD~1'
      max:
        description: 'Maximum URLs to submit'
        required: false
        default: '200'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Submit new and changed pages
        env:
          INDEXNOW_BASE: ${{ github.event_name == 'workflow_dispatch' && inputs.base || github.event.before }}
          INDEXNOW_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.max || '200' }}
        run: |
          if [ -z "$INDEXNOW_BASE" ] || [ "$INDEXNOW_BASE" = "0000000000000000000000000000000000000000" ]; then export INDEXNOW_BASE=HEAD~1; fi
          python submit_indexnow.py
