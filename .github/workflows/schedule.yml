name: Update Schedule + Build Site

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run schedule updater
        run: python schedule_update.py

      - name: Fetch NOAA propagation data
        run: python fetch_propagation.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site
        run: node build.js

      - name: Commit updated files + built site
        run: |
          git config user.name "shortwavehq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/schedule.json data/schedule-changes.json data/propagation.json dist
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update schedule + propagation + rebuild ($(date -u +%Y-%m-%d))"
            git push
          fi
