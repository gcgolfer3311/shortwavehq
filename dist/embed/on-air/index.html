function pad(n){return n<10?'0'+n:''+n;}
function act(s,e,m){if(e>=1440)return m>=s||m<e-1440;if(e<s)return m>=s||m<e;return s<=m&&m<e;}
function until(r){if(r.s===0&&r.e>=1440)return 'all day';var e=r.e>=1440?r.e-1440:r.e;return 'until '+pad(Math.floor(e/60))+pad(e%60)+'z';}
function render(rows){

 document.getElementById('clk').textContent=pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+' UTC';
